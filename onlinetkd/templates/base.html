{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>KUSA NAIROBI NORTH INDOOR TAEKWONDO CHAMPIONSHIP 1</title>
    <meta charset="utf-8">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            font-family: Arial, sans-serif;
            background: url("{% static 'images/image.png' %}") no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.55));
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 10px;
            backdrop-filter: blur(3px);
        }

        h1 {
            color: #ffcc00;
            border-bottom: 3px solid #ffcc00;
            padding-bottom: 10px;
            margin-top: 0;
            text-shadow: 2px 2px 6px #000;
        }

        .nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            padding: 6px 12px;
            border: 1px solid #fff;
            border-radius: 5px;
            transition: 0.2s;
        }

        .nav a:hover {
            background: #b30000;
            border-color: #b30000;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.92);
            color: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #b30000;
            color: #fff;
        }

        .messages {
            padding: 10px;
            background: #fff3cd;
            color: #000;
            border: 1px solid #ffc107;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            color: #fff;
        }

        form input[type="text"] form input[type="tel"] form input[type="email"] form select {
            width: 300px;
            max-width: 100px;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        form input[type="checkbox"] {
            transform: scale(1.2);
            margin-left: 5px;
        }

        form button[type="submit"] {
            background: #b30000;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        form button[type="submit"]:hover {
            background: #8a0000;
        }

        .bracket-round {
            margin-bottom: 25px;
        }

        .bracket-round h3 {
            background: #b30000;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .match {
            border: 1px solid #999;
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.92);
            color: #000;
            border-radius: 4px;
        }

        .seed {
            color: #b30000;
            font-weight: bold;
        }

        .bye {
            color: #999;
            font-style: italic;
        }

        .success-box {
            text-align: center;
            padding: 40px 20px;
        }

        .success-box h2 {
            color: #28d17c;
            font-size: 2em;
            text-shadow: 2px 2px 4px #000;
        }

        .success-box .tick {
            font-size: 4em;
        }

        .success-box a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background: #b30000;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .success-box a:hover {
            background-color: #8a0000;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>KUSA NAIROBI NORTH INDOOR TAEKWONDO CHAMPIONSHIP 1</h1>
        <div class="nav">
            <a href="/register/">Register</a>
            <a href="/competitors/">Competitors</a>
            <a href="/draws/">Draws</a>
            <a href="/admin/">Admin</a>
        </div>
        <hr style="border-color: rgba(255, 255, 255, 0.3);">

        {% if messages %}
        {% for m in messages %}<div class="messages">{{ m }}</div>{% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>

</html>
